ReleaseNotes: |-
  - External monitors: scrolling over the tray icon changes them too, over DDC/CI. All displays move together and keep their difference
  - Scroll changes menu: both displays, the built-in display or the monitor; Shift or Ctrl changes only one of them for a single scroll
  - The tray icon splits its rays between the laptop and the monitor, following the Windows display arrangement
  - Smooth brightness changes apply to monitors as well
  - Monitors that wake up after the laptop are picked up automatically
